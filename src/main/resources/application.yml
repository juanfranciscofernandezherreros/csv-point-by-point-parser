spring:
  application:
    name: csv-point-by-point-parser
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:csv-point-by-point-parser}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
    producer:
      key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    properties:
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL}
      specific.avro.reader: true
app:
  csv:
    allowed-root: ${CSV_ALLOWED_ROOT:/data/csv}
  kafka:
    topics:
      file-ready: ${KAFKA_FILE_READY_TOPIC:file.ready.point-by-point}
      parsed-point-by-point: ${KAFKA_PARSED_POINT_BY_POINT_TOPIC:point-by-point.parsed}
      dlt: ${KAFKA_POINT_BY_POINT_PARSER_DLT_TOPIC:file.ready.point-by-point.DLT}
    error:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
